[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crustify"
version = "0.1.0"
description = "Multi-agent C-to-Rust translation pipeline"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crustify-cli = "crustify.cli:main"
crustify-log-cost = "crustify.log_cost:main"
crustify-orchestrator-prompt = "crustify.orchestrator_prompt:main"
crustify-audit = "crustify_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crustify*"]

[tool.setuptools.package-data]
crustify = ["prompts/*.md", "prompts/skills/*.md"]
crustify_audit = ["prompts/*.md", "templates/*"]
