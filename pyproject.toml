[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crustify"
version = "0.1.0"
description = "Multi-agent C-to-Rust translation pipeline"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crustify-cli = "crustify.cli:main"
crustify-oracle = "crustify.oracle:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["crustify*"]
